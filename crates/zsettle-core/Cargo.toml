[package]
name = "zsettle-core"
description = "Atomic item-for-ZEC settlement on Zcash: two-party Ironwood transactions, note-sealed items, seller policy, provenance verifier with viewing keys only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
orchard = { workspace = true }
pczt = { workspace = true }
zcash_client_backend = { workspace = true }
zcash_client_sqlite = { workspace = true }
zcash_primitives = { workspace = true }
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true }
zcash_address = { workspace = true }
zcash_note_encryption = { workspace = true }
zcash_proofs = { workspace = true, optional = true }
zip321 = { workspace = true }
incrementalmerkletree = { workspace = true }
zip32 = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
age = { workspace = true }
bip0039 = { workspace = true }
secrecy = { workspace = true }
toml = { workspace = true }
rpassword = { workspace = true, optional = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
blake2b_simd = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
tonic = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
pasta_curves = { workspace = true }

# Without `native` (the browser build) Sapling never runs: a stand-in prover fills the
# wallet library's Sapling slots.
sapling-crypto = { version = "0.9", optional = true }
jubjub = { version = "0.11", optional = true }
bls12_381 = { version = "0.9", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"

[features]
default = ["native"]
# Network access through lightwalletd, wallet files and terminal prompts: the command-line
# tools and the app server. Without it the core builds for the browser, where the page
# fetches chain data and keeps the wallet itself.
native = [
    "dep:zcash_proofs",
    "dep:rpassword",
    "dep:tonic",
    "dep:tokio",
    "dep:rustls",
    "dep:async-trait",
    "dep:prost",
    "zcash_client_backend/lightwalletd-tonic-tls-webpki-roots",
    "zcash_client_backend/sync",
]
web = ["dep:sapling-crypto", "dep:jubjub", "dep:bls12_381"]

[dev-dependencies]
zcash_primitives = { workspace = true }
