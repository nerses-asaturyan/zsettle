# Stand-in for libsqlite3-sys 0.35 in the browser build: the same Rust interface over the
# SQLite build of sqlite-wasm-rs, since SQLite C code cannot be compiled for
# wasm32-unknown-unknown with the usual C library. `error.rs` is copied from
# libsqlite3-sys 0.35.0 (MIT, Copyright (c) 2014-2021 The rusqlite developers).
[package]
name = "libsqlite3-sys"
version = "0.35.0"
edition = "2021"
links = "sqlite3"
build = "build.rs"
license = "MIT"
publish = false

[dependencies]
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }

[features]
default = ["min_sqlite_version_3_14_0"]
bundled = ["bundled_bindings"]
bundled-windows = ["bundled_bindings"]
bundled_bindings = []
min_sqlite_version_3_14_0 = []
buildtime_bindgen = []
column_metadata = []
loadable_extension = []
preupdate_hook = []
session = []
sqlcipher = []
bundled-sqlcipher = []
bundled-sqlcipher-vendored-openssl = []
unlock_notify = []
in_gecko = []
wasm32-wasi-vfs = []
with-asan = []
