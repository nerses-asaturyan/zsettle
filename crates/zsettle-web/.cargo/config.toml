# Threads in the browser: shared memory and atomics, with the standard library rebuilt for
# them (nightly). See README.md in this directory.
[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--max-memory=4294967296",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
    "--cfg", "getrandom_backend=\"wasm_js\"",
]

[env]
# SQLite (C) must be compiled with the same thread features as the Rust code.
CFLAGS_wasm32_unknown_unknown = "-matomics -mbulk-memory"

[unstable]
build-std = ["panic_abort", "std"]
