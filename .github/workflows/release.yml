name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/release/zsettle$ext" "target/release/zsettle-seller$ext" dist/
          cp README.md dist/
          cp LICENSE-* dist/ 2>/dev/null || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "zsettle-${{ matrix.name }}.zip" ./dist/* > /dev/null
          else
            tar -C dist -czf "zsettle-${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zsettle-${{ matrix.name }}
          path: dist/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            zsettle-${{ matrix.name }}.tar.gz
            zsettle-${{ matrix.name }}.zip
