<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f4b728"/>
    </marker>
  </defs>
  <rect width="680" height="560" rx="14" fill="#151923"/>

  <rect x="30" y="20" width="160" height="34" rx="8" fill="#1b2030" stroke="#f4b728"/>
  <text x="110" y="42" fill="#eef0f6" font-weight="700" text-anchor="middle">Buyer (zsettle)</text>
  <rect x="260" y="20" width="160" height="34" rx="8" fill="#1b2030" stroke="#f4b728"/>
  <text x="340" y="42" fill="#eef0f6" font-weight="700" text-anchor="middle">Seller service</text>
  <rect x="490" y="20" width="160" height="34" rx="8" fill="#1b2030" stroke="#f4b728"/>
  <text x="570" y="42" fill="#eef0f6" font-weight="700" text-anchor="middle">Light server / chain</text>

  <line x1="110" y1="54" x2="110" y2="540" stroke="#3a4257" stroke-dasharray="4 4"/>
  <line x1="340" y1="54" x2="340" y2="540" stroke="#3a4257" stroke-dasharray="4 4"/>
  <line x1="570" y1="54" x2="570" y2="540" stroke="#3a4257" stroke-dasharray="4 4"/>

  <line x1="336" y1="88" x2="114" y2="88" stroke="#f4b728" marker-end="url(#a)"/>
  <text x="225" y="80" fill="#b4bbcc" text-anchor="middle">1. signed listings (GET /listings)</text>

  <line x1="114" y1="124" x2="566" y2="124" stroke="#f4b728" marker-end="url(#a)"/>
  <text x="340" y="116" fill="#b4bbcc" text-anchor="middle">2. sync, incl. imported item viewing key; branch check</text>

  <rect x="20" y="146" width="180" height="78" rx="8" fill="#1b2030" stroke="#3a4257"/>
  <text x="110" y="168" fill="#eef0f6" text-anchor="middle">3. build both actions</text>
  <text x="110" y="188" fill="#eef0f6" text-anchor="middle">IO finalize, prove</text>
  <text x="110" y="208" fill="#eef0f6" text-anchor="middle">(viewing keys only)</text>

  <rect x="20" y="236" width="180" height="44" rx="8" fill="#1b2030" stroke="#3a4257"/>
  <text x="110" y="263" fill="#eef0f6" text-anchor="middle">4. redact seller copy</text>

  <line x1="114" y1="306" x2="336" y2="306" stroke="#f4b728" marker-end="url(#a)"/>
  <text x="225" y="298" fill="#b4bbcc" text-anchor="middle">5. POST /offer (envelope)</text>

  <rect x="250" y="322" width="180" height="96" rx="8" fill="#1b2030" stroke="#3a4257"/>
  <text x="340" y="344" fill="#eef0f6" text-anchor="middle">6. public checks</text>
  <text x="340" y="364" fill="#eef0f6" text-anchor="middle">verify proof</text>
  <text x="340" y="384" fill="#eef0f6" text-anchor="middle">payment check</text>
  <text x="340" y="404" fill="#eef0f6" text-anchor="middle">sign action A only</text>

  <line x1="336" y1="442" x2="114" y2="442" stroke="#f4b728" marker-end="url(#a)"/>
  <text x="225" y="434" fill="#b4bbcc" text-anchor="middle">7. GET /reply/&lt;tag&gt; (signed copy)</text>

  <rect x="20" y="456" width="180" height="44" rx="8" fill="#1b2030" stroke="#3a4257"/>
  <text x="110" y="476" fill="#eef0f6" text-anchor="middle">8. combine, sign action B,</text>
  <text x="110" y="492" fill="#eef0f6" text-anchor="middle">extract</text>

  <line x1="114" y1="524" x2="566" y2="524" stroke="#f4b728" marker-end="url(#a)"/>
  <text x="340" y="516" fill="#b4bbcc" text-anchor="middle">9. broadcast (after a second branch check)</text>
</svg>
