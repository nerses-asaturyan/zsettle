[workspace]
resolver = "2"
members = [
    "crates/zsettle-core",
    "crates/zsettle",
    "crates/zsettle-seller",
    "crates/zsettle-app",
]
# The browser wallet builds on its own (nightly, WebAssembly); see crates/zsettle-web.
exclude = ["crates/zsettle-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nerses-asaturyan/zsettle"
authors = ["Nerses Asaturyan"]

[workspace.dependencies]
# Zcash stack: the released NU7 line (mainnet moves to NU7 at block 3,543,405; testnet since 4,465,026)
orchard = { version = "0.16", default-features = false, features = ["circuit", "std"] }
pczt = { version = "0.10", features = ["orchard", "prover", "signer", "io-finalizer", "spend-finalizer", "tx-extractor", "transparent"] }
zcash_client_backend = { version = "0.25", features = ["orchard", "pczt", "unstable"] }
zcash_client_sqlite = { version = "0.23", features = ["orchard", "unstable", "transparent-inputs"] }
zcash_primitives = "0.31"
zcash_protocol = "0.11"
zcash_keys = { version = "0.17", features = ["orchard"] }
zcash_address = "0.14"
zcash_note_encryption = "0.5"
zcash_proofs = { version = "0.31", features = ["bundled-prover", "local-prover"] }
zip321 = "0.10"
incrementalmerkletree = "0.9"
zip32 = "0.3"
rusqlite = { version = "0.37", features = ["serialize", "backup"] }
uuid = "1"

# wallet secrets
age = { version = "0.12", features = ["armor"] }
bip0039 = { version = "0.14", features = ["std"] }
secrecy = "0.8"
toml = "0.8"
rpassword = "7"
zeroize = "1"
ureq = { version = "2", default-features = false, features = ["tls", "socks-proxy", "proxy-from-env"] }

# networking
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
prost = "0.14"
pasta_curves = "0.6"

# general
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2b_simd = "1"
rand = "0.10"
rand_core = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
strip = true
