[workspace]
resolver = "2"
members = [
    "crates/zsettle-core",
    "crates/zsettle",
    "crates/zsettle-seller",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nerses-asaturyan/zsettle"
authors = ["Nerses Asaturyan"]

[workspace.dependencies]
# Zcash stack (mainnet = NU6.3 Ironwood; published crates only)
orchard = { version = "0.15", default-features = false, features = ["circuit", "std"] }
pczt = { version = "0.9", features = ["orchard", "prover", "signer", "io-finalizer", "spend-finalizer", "tx-extractor", "transparent"] }
zcash_client_backend = { version = "0.24", features = ["orchard", "pczt", "unstable", "lightwalletd-tonic-tls-webpki-roots", "sync"] }
zcash_client_sqlite = { version = "0.22", features = ["orchard", "unstable", "transparent-inputs"] }
zcash_primitives = "0.30"
zcash_protocol = "0.10"
zcash_keys = { version = "0.16", features = ["orchard"] }
zcash_address = "0.13"
zcash_note_encryption = "0.4"
zcash_proofs = { version = "0.30", features = ["bundled-prover", "local-prover"] }
zip321 = "0.9"
incrementalmerkletree = "0.8"
zip32 = "0.2"
rusqlite = "0.37"
uuid = "1"

# wallet secrets
age = { version = "0.12", features = ["armor"] }
bip0039 = { version = "0.14", features = ["std"] }
secrecy = "0.8"
toml = "0.8"
rpassword = "7"
zeroize = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }

# networking
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
pasta_curves = "0.5"

# general
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2b_simd = "1"
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
debug = 1
